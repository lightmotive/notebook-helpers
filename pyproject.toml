[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebook-helpers"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
drive = ["gdown"]

[tool.hatch.build.targets.wheel]
only-include = ["notebook_helpers.py"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q --cov=notebook_helpers --cov-fail-under=95"
